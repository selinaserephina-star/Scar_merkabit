kcp_version: "0.32"
project: scar-merkabit-joint
version: "0.1"
description: >
  THE JOINT WORLD (self-governing, TWO-PARTY). The lane where the Merkabit
  program (Stenberg: E6 minuscule crystal, the 27, rowmotion/promotion
  dynamics, magic monotone) and the Scar-Cat program (Balashov: PSL(2,7),
  the 168, representation-ring selection rules) meet. Contents: the T-SC
  audit of the Scar-Cat master registry (35+ rows re-verified, corrections
  R-SC-1..5); the bitangent-bridge theorem (both frameworks inside
  Sp6(2)=W(E7)/±: W(E6)=stabilizer of one bitangent, PSL(2,7) transitive on
  all 28, intersection = S3 = N(<z3>)); the chiral-Fano-pair result on the
  7-channel syndrome; THE RESURRECTION THEOREM (E6-branching of the E7 56 =
  27+27bar+1+1 with pr the sheet-mirror — v1's dual-spinor picture, refuted
  at E6, true at E7) with the bilingual-gates corollary; the 56-State
  Machine instrument; the joint paper draft (Stenberg-Balashov). Registry
  SCAR_MERKABIT_REGISTRY.md, rows SM-001..SM-014 (v0.1, 2026-08-30). House
  rules: compute never assert; refutations at equal prominence; Rule 3;
  fit-until-derived; control substrates; backport rule T-SC-P1. DRAFT /
  sealed-not-sent except as the registry records sends. Not RH/GRH; no
  physical constant; no novelty claim beyond flagged [obs] items.

maintainer:
  - selina@exoreaction.com          # Merkabit side
  - "Ilya Balashov (ORCID 0009-0001-1954-8872, OSF 10.17605/OSF.IO/3TFNY)"  # Scar-Cat side

updated: "2026-09-01"

# --- TRUST -------------------------------------------------------------------
trust:
  provenance:
    publisher: Stenberg x Balashov (with Claude)
    contact:
      - selina@exoreaction.com

# --- AUTHORITY (JOINT) -------------------------------------------------------
authority:
  read: initiative
  summarize: initiative
  modify: registry-discipline-only
  execute: initiative               # verifiers are self-contained, safe to rerun
  share_externally: requires_both_parties   # THE JOINT RULE: a send or a
                                            # publication needs Selina's AND
                                            # Ilya's word, each recorded in
                                            # the registry's Sends section.

# --- VISIBILITY --------------------------------------------------------------
visibility:
  default: internal
  intent: >
    Publication intent recorded (registry v0.1): the joint paper to
    arXiv/OSF after Ilya's review pass; the lane to a public repo on the
    joint go.

# --- HINTS -------------------------------------------------------------------
hints:
  recommended_entry_point: joint-registry
  house_rules: >
    Read README + SCAR_MERKABIT_REGISTRY before any claim from this lane.
    Every [C] traces to a listed verifier (Python 3 + numpy, no GAP);
    rerun before citing. [obs] = possibly-new observation, flagged for
    expert readers, never called novel. The two parent lanes govern
    themselves (CRYSTAL_NATIVE_v2 KCP; Ilya's registry) — this KCP wires
    ACROSS them, not over them.

